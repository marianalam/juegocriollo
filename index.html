/* Juego 4: apariciones de la palabra omitida COMO PALABRA COMPLETA (misma regla en el juego, el Editor, check() y la importación de Excel).
   Sin distinguir mayúsculas; sí tildes (ambos textos en NFC, así que también vale el acento descompuesto). Son caracteres de palabra \p{L}, \p{N} y \p{M}.
   Una palabra de varias palabras se busca como texto seguido; los límites solo se exigen en los extremos que son letra o número. Sin solapamientos. */

const pidOf=r=>String(r.participante||'').trim()||norm(r.equipo).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sin-identificar';

document.oninput=e=>{const t=e.target,p=t.dataset&&t.dataset.p;if(t.dataset&&t.dataset.xlrt!=null&&XLP){XLP.typed=t.value;const b=document.getElementById('xlconf');if(b)b.disabled=t.value.trim().toUpperCase()!=='REEMPLAZAR';return}if(t.dataset&&t.dataset.bqs){BQ[t.dataset.bqs].s=t.value;bqApply(t.dataset.bqs);return}if(t.dataset&&t.dataset.pg){const n=Math.floor(+t.value);if(n>0){C.perGame=C.perGame||{};C.perGame[t.dataset.pg]=n;save()}return}if(t.dataset&&t.dataset.ty&&t.type=='range'){tySet(t);return}if(t.dataset&&t.dataset.txSt){if(t.tagName!='SELECT'&&t.type!='checkbox')txSet(t);return}if(p&&t.closest&&t.closest('.txs')){let v=t.value;if(t.dataset.l)v=v.split('\n').map(x=>x.trim()).filter(Boolean);const mx=+t.dataset.max||0;if(mx){const k=txClamp(v,mx),cn=t.parentNode.querySelector('[data-cnt]');if(k.over){v=k.v;t.value=v}if(cn){const lim=k.over||k.n>=mx;cn.textContent=lim?'Límite de '+mx+' caracteres: no se puede escribir más.':k.n+' de '+mx+' caracteres. Si lo dejas vacío se usa el texto original.';cn.className=lim?'warn':'note'}}pset(C,p,v);save();txPrev();return}if(p&&p.startsWith('snd.')&&t.type=='range'){pset(C,p,+t.value);bgApply();save();const b=t.parentNode.querySelector('b');if(b)b.textContent=t.value+'%';return}if(t.dataset&&t.dataset.fs){const k=t.dataset.fs;C.design.fs=Object.assign(fsv(),{[k]:+t.value});theme();save();const b=document.getElementById('fsv-'+k);if(b)b.textContent=t.value+'%';return}if(p&&/^g4\.\d+\.(frag|ans)$/.test(p)){const c=t.closest('.card');c.querySelector('.lyr').innerHTML=lyr(c.querySelector('[data-p$=".frag"]').value,c.querySelector('[data-p$=".ans"]').value)}};
document.onchange=e=>{const t=e.target,d=t.dataset;if(d&&d.xlm&&XLP){XLP.mode=d.xlm;XLP.cf=false;XLP.msg='';xlsDraw();return}if(d&&d.xlck&&XLP){if(d.xlck=='ack')XLP.ack=t.checked;else XLP.skipDup=t.checked;XLP.cf=false;xlsDraw();return}if(d&&d.bqf){BQ[d.bqf].f=t.value;render();return}if(t.hasAttribute&&t.hasAttribute('data-txsel')){TXSEL=t.value;render();return}if(d.txSt){txSet(t);if(t.tagName=='SELECT'||t.type=='checkbox')render();return}if(d.ty){if(t.type!='range'){tySet(t);render()}return}if(d.up){if(d.k=='font'&&t.files[0])C.typo[d.up.split('.')[1]].f='custom';return up(d.up,d.k,t.files[0])}if(d.addl)return addList(d.addl,[...t.files]);if(d.imp)return imp(t.files[0]);if(d.newp){if(!t.files[0])return;C.design.pieces.push({img:null,on:false,role:'bg',where:'cover',fit:'cover',px:false,size:15,side:'left'});return up('design.pieces.'+(C.design.pieces.length-1)+'.img','img',t.files[0])}
if(d.p){let v=t.type=='checkbox'?t.checked:t.type=='range'?+t.value:t.value;if(d.l)v=v.split('\n').map(s=>s.trim()).filter(Boolean);pset(C,d.p,v);save();theme();if(d.p.startsWith('design'))render();if(d.p.startsWith('snd'))bgApply()}};

else{IDN=0;try{C=fixC(JSON.parse(localStorage.cfg));if(IDN)save()}catch(e){C=DEF();ensureIds(C)}await loadBlobs()}}
